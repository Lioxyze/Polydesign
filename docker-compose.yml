# Local development services.
# The API and the web app run on the host (npm run dev); only the
# infrastructure they depend on runs in containers.
name: polydesign

services:
  mysql:
    image: mysql:8.4
    container_name: polydesign-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-polydesign}
      MYSQL_USER: ${MYSQL_USER:-polydesign}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-polydesign}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - '${MYSQL_PORT:-3306}:3306'
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test:
        ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uroot', '-p${MYSQL_ROOT_PASSWORD:-root}']
      interval: 5s
      timeout: 5s
      retries: 20

  # S3-compatible object storage for 3D files and images (local replacement for AWS S3).
  # The bucket is created at startup; any access key / secret key is accepted.
  s3:
    image: adobe/s3mock:latest
    container_name: polydesign-s3
    restart: unless-stopped
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: ${S3_BUCKET:-polydesign}
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: 'true'
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /data
    ports:
      - '9000:9090' # S3 API (http)
    volumes:
      - s3-data:/data

  # Catches every e-mail sent by the API (account confirmation, password reset...)
  mailpit:
    image: axllent/mailpit:latest
    container_name: polydesign-mailpit
    restart: unless-stopped
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # Web UI

volumes:
  mysql-data:
  s3-data:
