name: Feature
description: A user story or a technical task
labels: ['feature']
body:
  - type: textarea
    id: story
    attributes:
      label: User story
      description: As a <role>, I want <goal> so that <benefit>.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Technical notes
